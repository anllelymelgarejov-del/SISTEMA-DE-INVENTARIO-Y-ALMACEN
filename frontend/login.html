<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema WMS - Control de Almacenes</title>
  
  <!-- Bootstrap 5.3.3 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      max-width: 420px;
      width: 100%;
    }
    .login-header {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 2.25rem 2rem 1.75rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container p-3">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        
        <div class="login-card mx-auto">
          <!-- Cabecera de la Tarjeta -->
          <div class="login-header">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 shadow-sm mb-3" style="width: 58px; height: 58px; background: linear-gradient(135deg, #4f46e5, #4338ca) !important;">
              <i class="fa-solid fa-boxes-stacked fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Sistema WMS</h3>
            <p class="text-muted small mb-0">Gestión de Almacenes, Lotes y Control de Stock</p>
          </div>

          <!-- Cuerpo del Formulario de Autenticación -->
          <div class="p-4 p-sm-4">
            
            <div id="login-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form id="form-login" autocomplete="off">
              <!-- Campo: Correo Electrónico -->
              <div class="mb-3">
                <label for="login-email" class="form-label small fw-semibold text-secondary">
                  Correo Electrónico
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0">
                    <i class="fa-solid fa-envelope"></i>
                  </span>
                  <input 
                    type="email" 
                    class="form-control border-start-0 ps-0" 
                    id="login-email" 
                    required 
                    placeholder="usuario@almacen.com"
                    autocomplete="off">
                </div>
              </div>

              <!-- Campo: Contraseña -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="login-password" class="form-label small fw-semibold text-secondary mb-0">
                    Contraseña
                  </label>
                  <!-- Enlace opcional de recuperación (deshabilitado en producción)
                  <a href="#" class="small text-primary text-decoration-none fw-medium" tabindex="-1">
                    ¿Olvidaste tu contraseña?
                  </a>
                  -->
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0">
                    <i class="fa-solid fa-lock"></i>
                  </span>
                  <input 
                    type="password" 
                    class="form-control border-start-0 ps-0" 
                    id="login-password" 
                    required 
                    placeholder="••••••••"
                    autocomplete="off">
                  <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="btn-toggle-password" title="Ver / Ocultar">
                    <i class="fa-solid fa-eye" id="icon-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Botón de Envío -->
              <button type="submit" id="btn-submit-login" class="btn btn-primary w-100 py-2.5 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2" style="background: #4f46e5; border-color: #4f46e5;">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Ingresar al Sistema</span>
              </button>
            </form>

          </div>

          <!-- Pie de la Tarjeta (Producción) -->
          <div class="bg-light py-2.5 text-center text-muted small border-top" style="font-size: 0.78rem;">
            &copy; 2026 WMS Almacén Pro. Todos los derechos reservados.
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE_URL = window.location.origin;

    // Redirigir automáticamente a index.html si ya existe un token en localStorage
    if (localStorage.getItem('token')) {
      window.location.href = 'index.html';
    }

    // Alternar visibilidad de contraseña
    const btnToggle = document.getElementById('btn-toggle-password');
    const inputPass = document.getElementById('login-password');
    const iconEye = document.getElementById('icon-eye');

    btnToggle.addEventListener('click', () => {
      if (inputPass.type === 'password') {
        inputPass.type = 'text';
        iconEye.className = 'fa-solid fa-eye-slash';
      } else {
        inputPass.type = 'password';
        iconEye.className = 'fa-solid fa-eye';
      }
    });

    // Manejador del formulario de inicio de sesión
    const formLogin = document.getElementById('form-login');
    const btnSubmit = document.getElementById('btn-submit-login');
    const alertBox = document.getElementById('login-alert');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      alertBox.classList.add('d-none');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Validando...';

      try {
        // Petición a POST /api/auth/login
        const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.mensaje || 'Error en la autenticación');
        }

        // Extraer token y datos del usuario
        const token = data.token || data.data?.token;
        const usuario = data.usuario || data.data?.usuario;

        if (!token || !usuario) {
          throw new Error('Respuesta inválida del servidor: no se recibió el token de sesión.');
        }

        // Guardar token JWT y datos de sesión en localStorage
        localStorage.setItem('token', token);
        localStorage.setItem('nombre', usuario.nombre);
        localStorage.setItem('rol', usuario.rol);
        localStorage.setItem('usuario', JSON.stringify(usuario));

        Swal.fire({
          icon: 'success',
          title: `¡Bienvenido, ${usuario.nombre}!`,
          text: `Rol: ${usuario.rol}. Redirigiendo al panel principal...`,
          timer: 1400,
          showConfirmButton: false
        }).then(() => {
          window.location.href = 'index.html';
        });

      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove('d-none');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>Ingresar al Sistema</span>';
      }
    });
  </script>
</body>
</html>
